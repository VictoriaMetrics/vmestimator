# Default alerts for vmestimator. These are recommendations and may require
# threshold calibration for your specific setup. They are based on the example
# configuration at https://github.com/VictoriaMetrics/vmestimator/blob/main/streams.yaml
groups:
  - name: 'cardinality.recording'
    rules:
      - record: 'cardinality_estimate:weekly_avg'
        expr: 'avg_over_time((max(cardinality_estimate{interval="30m0s"}) without(instance))[1w:5m])'

      - record: 'cardinality_estimate:weekly_stddev'
        expr: 'stddev_over_time((max(cardinality_estimate{interval="30m0s"}) without(instance))[1w:5m])'

  - name: 'cardinality'
    rules:
      - alert: 'JobTooHighCardinality'
        expr: 'max (cardinality_estimate{group_by_keys="job",interval="30m0s"}) without(instance) > 20000'
        for: '15m'
        labels:
          severity: 'warning'
        annotations:
          dashboard: "{{ $externalURL }}/d/mktd5g9?var-group_by_keys=job&var-interval={{ $labels.interval }}"
          summary: "High cardinality for job {{ $labels.group_by_values }}"
          description: "Job {{ $labels.group_by_values }} has {{ $value }} estimated series over the last {{ $labels.interval }}, exceeding the 20000 series threshold."

      - alert: 'JobTooHighChurnRate'
        expr: |
          (
              max(cardinality_estimate{group_by_keys="job",interval="30m0s"}) without (instance)
              -
              max(cardinality_estimate{group_by_keys="job",interval="15m0s"}) without (instance)
          )
          /
          max(cardinality_estimate{group_by_keys="job",interval="30m0s"}) without (instance) * 100 > 10
        for: '15m'
        labels:
          severity: 'warning'
        annotations:
          dashboard: "{{ $externalURL }}/d/mktd5g9?var-group_by_keys=job&var-churn_short=15m0s&var-churn_long=30m0s"
          summary: "High churn rate for job {{ $labels.group_by_values }}"
          description: 'Job {{ $labels.group_by_values }} has {{ printf "%.0f%%" $value }} of series churned between the 15m and 30m cardinality windows, exceeding the 10% threshold.'

      - alert: 'GlobalCardinalityTooHigh'
        expr: |
          # 3-sigma anomaly detection: fire when current cardinality exceeds the weekly
          # mean by more than 3 standard deviations, using the recording rules computed
          # in the cardinality.recording group above.
          (
            max(cardinality_estimate{group_by_keys="__global__",interval="30m0s"}) without(instance)
            >
            (
              cardinality_estimate:weekly_avg{group_by_keys="__global__",interval="30m0s"}
              + 3 * cardinality_estimate:weekly_stddev{group_by_keys="__global__",interval="30m0s"}
            )
          )
          # Floor condition: ensures the threshold is never too close to the mean — for a perfectly
          # stable baseline where stddev=0, require at least 20% growth before firing.
          AND (
            max(cardinality_estimate{group_by_keys="__global__",interval="30m0s"}) without(instance)
            >
            cardinality_estimate:weekly_avg{group_by_keys="__global__",interval="30m0s"} * 1.2
          )
          # Guard: skip when the global historical baseline is too small for 3-sigma to be
          # meaningful — a database with avg 10k series hitting 13k is noise, not an incident.
          # Adjust the threshold to match the typical scale of your environment.
          AND cardinality_estimate:weekly_avg{group_by_keys="__global__",interval="30m0s"} > 100000
        for: '30m'
        labels:
          severity: 'warning'
        annotations:
          dashboard: "{{ $externalURL }}/d/mktd5g9?var-group_by_keys={{ $labels.group_by_keys }}&var-interval={{ $labels.interval }}&from={{($activeAt.Add (parseDurationTime \"-1h\")).UnixMilli}}&to={{($activeAt.Add (parseDurationTime \"1h\")).UnixMilli}}"
          summary: "Global cardinality is too high"
          description: |
            Global cardinality is {{ printf "%.0f" $value }} estimated active series,
            exceeding the weekly mean + 3 stddev.
            High cardinality is often caused by labels with unbounded values (UUIDs, request IDs, error messages, URL paths).
            To investigate, check job or __name__ cardinality estimates, or use the VM cardinality explorer.

      - alert: 'JobCardinalityTooHigh'
        expr: |
          # 3-sigma anomaly detection: fire when current cardinality exceeds the weekly
          # mean by more than 3 standard deviations, using the recording rules computed
          # in the cardinality.recording group above.
          (
            max(cardinality_estimate{group_by_keys="job",interval="30m0s"}) without(instance)
            >
            (
              cardinality_estimate:weekly_avg{group_by_keys="job",interval="30m0s"}
              + 3 * cardinality_estimate:weekly_stddev{group_by_keys="job",interval="30m0s"}
            )
          )
          AND
          (
            max(cardinality_estimate{group_by_keys="job",interval="30m0s"}) without(instance)
            >
            cardinality_estimate:weekly_avg{group_by_keys="job",interval="30m0s"} * 1.2
          )
          # Guard: skip jobs whose historical baseline is too small for 3-sigma to be
          # meaningful — a job with avg 5 series hitting 10 is noise, not an incident.
          # Adjust the threshold to match the typical scale of your environment.
          AND cardinality_estimate:weekly_avg{group_by_keys="job",interval="30m0s"} > 10000
        for: '30m'
        labels:
          severity: 'warning'
        annotations:
          dashboard: "{{ $externalURL }}/d/mktd5g9?var-group_by_keys={{ $labels.group_by_keys }}&var-interval={{ $labels.interval }}&from={{($activeAt.Add (parseDurationTime \"-1h\")).UnixMilli}}&to={{($activeAt.Add (parseDurationTime \"1h\")).UnixMilli}}"
          summary: "High cardinality for job {{ $labels.group_by_values }}"
          description: |
            Job {{ $labels.group_by_values }} has {{ printf "%.0f" $value }} estimated active series,
            exceeding the weekly mean + 3 stddev.
            High cardinality is often caused by labels with unbounded values (UUIDs, request IDs, error messages, URL paths).
            To investigate, check the job's instance scrape response in vmagent, or use the VM cardinality explorer.

      - alert: 'CardinalityGroupLimitNearlyReached'
        expr: |
          (
            sum(vmestimator_estimator_group_size) by (job, group_by_keys, interval)
            /
            sum(vmestimator_estimator_group_limit) by (job, group_by_keys, interval)
            * 100
          ) > 80
        for: '15m'
        labels:
          severity: 'warning'
        annotations:
          dashboard: "{{ $externalURL }}/d/mktd5g9?var-group_by_keys={{ $labels.group_by_keys }}&var-interval={{ $labels.interval }}"
          summary: "Cardinality estimate group limit nearly reached for {{ $labels.group_by_keys }}"
          description: >
            The number of tracked groups for group_by_keys={{ $labels.group_by_keys }}
            has reached {{ printf "%.0f%%" $value }} of the configured group_limit. 
            New groups may soon be rejected.
            
            Consider investigating the source of the cardinality growth and either
            reducing it or increasing group_limit in the stream configuration.

      - alert: 'CardinalityGroupLimitReached'
        expr: 'sum(vmestimator_estimator_group_rejected_size) by (job, group_by_keys, interval) > 0'
        for: '5m'
        labels:
          severity: 'critical'
        annotations:
          dashboard: "{{ $externalURL }}/d/mktd5g9?var-group_by_keys={{ $labels.group_by_keys }}&var-interval={{ $labels.interval }}"
          summary: "Group limit reached for {{ $labels.group_by_keys }}"
          description: >
            {{ printf "%.0f" $value }} groups for group_by_keys={{ $labels.group_by_keys }}
            cannot be tracked individually because group_limit has been reached.
            
            Consider investigating the source of the cardinality growth and either
            reducing it or increasing group_limit in the stream configuration.